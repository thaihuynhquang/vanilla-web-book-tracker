<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Vanilla Web Book Tracker</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-brand">
        <svg class="header-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--primary)" />
          <path d="M9 8h10a4 4 0 0 1 4 4 4 4 0 0 1-1.5 3.1A4 4 0 0 1 23 19a4 4 0 0 1-4 4H9z" stroke="#f9fafb" stroke-width="2" stroke-linejoin="round" fill="none" />
        </svg>
        <div>
          <h1 data-i18n="app.title">Vanilla Web Book Tracker</h1>
          <p class="header-subtitle" data-i18n="app.subtitle">Reading &amp; Practice Tracker</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="btn-export" class="icon-btn" data-i18n-title="header.export" title="Export"></button>
        <button type="button" id="btn-import" class="icon-btn" data-i18n-title="header.import" title="Import"></button>
        <input type="file" id="input-import" accept="application/json" hidden />
        <button type="button" id="btn-reset" class="icon-btn icon-btn--danger" data-i18n-title="header.reset" title="Reset"></button>
        <button type="button" id="btn-lang" class="icon-btn" data-i18n-title="header.lang">
          <span id="btn-lang-label">EN</span>
        </button>
        <button type="button" id="btn-theme" class="icon-btn" data-i18n-title="header.theme">
          <span id="btn-theme-icon"></span>
        </button>
      </div>
    </header>

    <nav class="nav-tabs-container">
      <button type="button" class="nav-tab" data-nav-tab="dashboard">
        <span data-i18n="nav.dashboard">Dashboard</span>
        <span id="badge-overall-pct" class="nav-tab-badge"></span>
      </button>
      <button type="button" class="nav-tab" data-nav-tab="chapters" data-i18n="nav.chapters">Chapters</button>
      <button type="button" class="nav-tab" data-nav-tab="labs" data-i18n="nav.labs">Labs &amp; Flashcards</button>
      <button type="button" class="nav-tab" data-nav-tab="glossary" data-i18n="nav.glossary">Glossary</button>
      <button type="button" class="nav-tab" data-nav-tab="resources" data-i18n="nav.resources">Resources</button>
      <button type="button" class="nav-tab" data-nav-tab="quitcriteria" data-i18n="nav.quitcriteria">Quit Criteria</button>
    </nav>

    <main class="main-content">
      <book-view-dashboard data-view="dashboard"></book-view-dashboard>
      <book-view-chapters data-view="chapters" hidden></book-view-chapters>
      <book-view-labs data-view="labs" hidden></book-view-labs>
      <book-view-glossary data-view="glossary" hidden></book-view-glossary>
      <book-view-resources data-view="resources" hidden></book-view-resources>
      <book-view-quitcriteria data-view="quitcriteria" hidden></book-view-quitcriteria>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
